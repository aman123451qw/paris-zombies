<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Enemy Placeholder Viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #cfd8e3; overflow: hidden; font-family: system-ui, sans-serif; }
  #labels { position: fixed; bottom: 16px; left: 0; right: 0; display: flex; justify-content: space-around; pointer-events: none; }
  #labels div { background: rgba(0,0,0,.65); color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 14px; }
  #ui { position: fixed; top: 12px; left: 12px; background: rgba(0,0,0,.65); color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 13px; }
  #ui button { margin-right: 6px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ui">Drag to orbit · Clip:
  <button data-clip="Idle">Idle</button><button data-clip="Walk">Walk</button><button data-clip="Run">Run</button>
</div>
<div id="labels"><div>Runner</div><div>Heavy</div><div>Thrower</div></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfd8e3);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1.6, 7.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7f6a, 1.4));
const sun = new THREE.DirectionalLight(0xfff1d6, 2.2);
sun.position.set(4, 8, 6); sun.castShadow = true;
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x9a968e }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

const black = (c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.9 });
const findBone = (root, part) => { let b = null; root.traverse(o => { if (!b && o.isBone && o.name.endsWith(part)) b = o; }); return b; };

function dressAsCrew(model) {
  model.traverse(o => { if (o.isMesh) { o.material = black(o.name.includes('Visor') ? 0x050505 : 0x151515); o.castShadow = true; } });
  const head = findBone(model, 'Head');
  // Hood: a back-facing half shell around the head (Soldier bones are in cm-scaled space, so read world size).
  const hood = new THREE.Mesh(new THREE.SphereGeometry(13, 16, 12, 0, Math.PI * 2, 0, Math.PI * 0.62), black(0x111111));
  hood.position.set(0, 10, -2); head.add(hood);
  return model;
}
function attach(model, boneName, mesh, pos, rot) {
  const b = findBone(model, boneName); mesh.position.set(...pos); mesh.rotation.set(...rot); b.add(mesh);
}

const loader = new GLTFLoader();
const mixers = [], actions = [];
const files = ["crew_runner","crew_heavy","crew_thrower"], xs = [-2.2, 0, 2.2];
for (let i = 0; i < 3; i++) {
  const g = await loader.loadAsync("assets/" + files[i] + ".glb");
  const m = g.scene; const h = new THREE.Box3().setFromObject(m).getSize(new THREE.Vector3()).y;
  m.scale.setScalar(1.8 / h); m.position.x = xs[i];
  m.traverse(o => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; } });
  scene.add(m);
  const mixer = new THREE.AnimationMixer(m); mixers.push(mixer);
  const run = mixer.clipAction(g.animations[0]); actions.push({ Idle: null, Walk: run, Run: run }); 
  if (location.hash !== "#still") run.play();
}
document.querySelectorAll('#ui button').forEach(btn => btn.onclick = () => {
  actions.forEach(map => { const a = map[btn.dataset.clip]; Object.values(map).forEach(x => x && x.stop()); if (a) a.play(); });
});

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => { const dt = clock.getDelta(); mixers.forEach(m => m.update(dt)); controls.update(); renderer.render(scene, camera); });
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
